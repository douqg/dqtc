<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Pages 图床 · dqtc</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --purple-900: #4c1d95;
    --purple-700: #6d28d9;
    --purple-600: #7c3aed;
    --purple-500: #8b5cf6;
    --purple-400: #a855f7;
    --purple-100: #ede9fe;
    --purple-50: #f5f3ff;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f3ff;
    background-image: radial-gradient(circle at 12% 0%, #ede9fe 0%, transparent 45%),
                      radial-gradient(circle at 88% 8%, #fae8ff 0%, transparent 40%);
    background-attachment: fixed;
    color: #1f2937;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 顶部标题栏 ---------- */
  header {
    background: linear-gradient(135deg, #6d28d9 0%, #9333ea 48%, #d946ef 100%);
    color: #fff;
    padding: 26px 0;
    box-shadow: 0 8px 28px rgba(109, 40, 217, .28);
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    width: 420px; height: 420px;
    right: -140px; top: -240px;
    background: radial-gradient(circle, rgba(255,255,255,.22), transparent 65%);
    border-radius: 50%;
    pointer-events: none;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 20px;
  }

  header .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }

  h1 {
    margin: 0 0 7px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sub {
    font-size: 12.5px;
    opacity: .88;
    word-break: break-all;
    line-height: 1.5;
  }

  .btn-refresh {
    background: rgba(255, 255, 255, .18);
    border: 1px solid rgba(255, 255, 255, .45);
    color: #fff;
    padding: 10px 18px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    transition: .22s;
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  .btn-refresh:hover { background: rgba(255, 255, 255, .32); transform: translateY(-1px); }
  .btn-refresh:active { transform: translateY(0); }
  .btn-refresh.spinning { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 主体 ---------- */
  main {
    max-width: 1120px;
    margin: 24px auto 80px;
    padding: 0 20px;
  }

  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 18px rgba(109, 40, 217, .09);
    margin-bottom: 20px;
    animation: fadeUp .35s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--purple-700);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    display: inline-block;
    min-width: 22px;
    padding: 1px 8px;
    border-radius: 99px;
    background: var(--purple-100);
    color: var(--purple-700);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }

  /* ---------- 输入行 ---------- */
  .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .input-row input[type="password"],
  .input-row input[type="text"] {
    flex: 1 1 300px;
    min-width: 0;
    padding: 11px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    background: #fafaf9;
    transition: .2s;
    color: #1f2937;
  }
  .input-row input:focus {
    border-color: var(--purple-400);
    box-shadow: 0 0 0 3px rgba(168, 85, 247, .15);
    background: #fff;
  }

  .btn {
    border: none;
    cursor: pointer;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    padding: 11px 20px;
    transition: .2s;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: linear-gradient(135deg, var(--purple-600), var(--purple-400));
    color: #fff;
    box-shadow: 0 3px 12px rgba(124, 58, 237, .32);
  }
  .btn-primary:hover { filter: brightness(1.08); }

  .btn-ghost {
    background: #f3f4f6;
    color: #4b5563;
  }
  .btn-ghost:hover { background: #e5e7eb; }

  .hint {
    margin-top: 10px;
    font-size: 12.5px;
    color: #9ca3af;
    line-height: 1.6;
  }
  .hint.ok { color: #059669; font-weight: 500; }

  /* ---------- 拖拽上传区 ---------- */
  .dropzone {
    border: 2px dashed #c4b5fd;
    border-radius: 14px;
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    background: linear-gradient(180deg, #faf5ff, #f5f3ff);
    transition: .22s;
    user-select: none;
  }
  .dropzone:hover {
    border-color: var(--purple-500);
    background: #f3e8ff;
  }
  .dropzone.dragover {
    border-color: #9333ea;
    background: #ede9fe;
    transform: translateY(-2px);
    box-shadow: 0 0 0 5px rgba(168, 85, 247, .14);
  }

  .dz-icon {
    font-size: 34px;
    line-height: 1;
    margin-bottom: 12px;
  }
  .dz-main {
    font-size: 15px;
    font-weight: 600;
    color: var(--purple-700);
    margin-bottom: 7px;
  }
  .dz-hint {
    font-size: 12px;
    color: #a78bfa;
    line-height: 1.6;
    padding: 0 10px;
  }

  /* ---------- 上传进度项 ---------- */
  .upload-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 13px;
    background: #fafafa;
    border: 1px solid #f1f1f4;
    border-radius: 10px;
    margin-top: 10px;
    font-size: 13px;
    animation: fadeUp .25s ease both;
  }
  .u-name {
    flex: 0 1 230px;
    min-width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #374151;
    font-weight: 500;
  }
  .bar {
    flex: 1 1 120px;
    height: 7px;
    min-width: 70px;
    background: #e9d5ff;
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, #8b5cf6, #d946ef);
    transition: width .25s ease;
  }
  .bar-fill.success { background: linear-gradient(90deg, #10b981, #34d399); }
  .bar-fill.error   { background: linear-gradient(90deg, #ef4444, #f87171); }
  .u-status {
    flex: 0 0 auto;
    font-size: 12px;
    color: #6b7280;
    min-width: 64px;
    text-align: right;
  }
  .u-status.success { color: #059669; }
  .u-status.error   { color: #dc2626; }

  /* ---------- 图库 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
    gap: 16px;
  }

  .grid-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 46px 12px;
    color: #9ca3af;
    font-size: 14px;
  }
  .grid-msg.error { color: #dc2626; }

  .file-card {
    background: #fff;
    border: 1px solid #f3f0fa;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 14px rgba(109, 40, 217, .10);
    display: flex;
    flex-direction: column;
    transition: transform .18s ease, box-shadow .18s ease;
    animation: fadeUp .3s ease both;
  }
  .file-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 26px rgba(109, 40, 217, .18);
  }

  .thumb {
    height: 150px;
    background: #f5f3ff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb.audio {
    flex-direction: column;
    gap: 10px;
    padding: 0 12px;
    background: linear-gradient(135deg, #faf5ff, #f3e8ff);
  }
  .audio-icon { font-size: 26px; line-height: 1; }
  .thumb.audio audio { width: 100%; max-width: 100%; }

  .thumb-fallback {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 30px;
    color: #c4b5fd;
  }
  .thumb-fallback span { font-size: 11px; color: #a78bfa; }

  .file-body {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1;
  }

  .file-name {
    font-size: 13px;
    font-weight: 600;
    color: #1f2937;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-meta {
    font-size: 11px;
    color: #9ca3af;
    margin-top: -5px;
  }

  .link-row { display: flex; gap: 6px; }

  .link-input {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    font-family: inherit;
    padding: 7px 9px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    color: #6b7280;
    background: #f9fafb;
    outline: none;
    transition: .18s;
  }
  .link-input:focus {
    border-color: var(--purple-400);
    background: #fff;
    color: #374151;
  }

  .btn-sm {
    padding: 7px 11px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: .18s;
    white-space: nowrap;
  }
  .btn-sm:active { transform: translateY(1px); }

  .btn-copy { background: #ede9fe; color: #6d28d9; }
  .btn-copy:hover { background: #ddd6fe; }

  .btn-open { background: #e0f2fe; color: #0369a1; }
  .btn-open:hover { background: #bae6fd; }

  .btn-del { background: #fee2e2; color: #dc2626; }
  .btn-del:hover { background: #fecaca; }
  .btn-del:disabled { opacity: .55; cursor: not-allowed; }

  .actions { display: flex; gap: 6px; margin-top: auto; }
  .actions .btn-sm { flex: 1; text-align: center; }

  /* ---------- Toast ---------- */
  #toasts {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    padding: 12px 18px;
    border-radius: 11px;
    color: #fff;
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.5;
    max-width: 330px;
    word-break: break-word;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    background: #374151;
    opacity: 0;
    transform: translateX(120%);
    transition: transform .3s cubic-bezier(.2, .85, .35, 1), opacity .3s;
  }
  .toast.show { opacity: 1; transform: translateX(0); }
  .toast.success { background: linear-gradient(135deg, #059669, #10b981); }
  .toast.error   { background: linear-gradient(135deg, #dc2626, #ef4444); }
  .toast.info    { background: linear-gradient(135deg, #6d28d9, #9333ea); }

  @media (max-width: 560px) {
    h1 { font-size: 18px; }
    .panel { padding: 16px; border-radius: 14px; }
    .u-name { flex-basis: 110px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .thumb { height: 120px; }
    #toasts { left: 12px; right: 12px; top: 12px; }
    .toast { max-width: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <h1>🖼️ GitHub Pages 图床</h1>
      <div class="sub" id="repoInfo"></div>
    </div>
    <button class="btn-refresh" id="refreshBtn">⟳ 刷新图库</button>
  </div>
</header>

<main>
  <!-- Token -->
  <section class="panel">
    <h2 class="panel-title">🔑 GitHub Token</h2>
    <div class="input-row">
      <input type="password" id="tokenInput" placeholder="粘贴 GitHub Personal Access Token（需 repo / contents 写权限）" autocomplete="off" spellcheck="false">
      <button class="btn btn-primary" id="saveTokenBtn">保存</button>
      <button class="btn btn-ghost" id="clearTokenBtn">清除</button>
    </div>
    <div class="hint" id="tokenHint"></div>
  </section>

  <!-- 上传 -->
  <section class="panel">
    <h2 class="panel-title">⬆️ 上传文件</h2>
    <div class="dropzone" id="dropzone">
      <div class="dz-icon">📁</div>
      <div class="dz-main">点击选择文件，或把文件拖到这里</div>
      <div class="dz-hint" id="dzHint"></div>
    </div>
    <input type="file" id="fileInput" multiple hidden>
    <div id="uploadList"></div>
  </section>

  <!-- 图库 -->
  <section class="panel">
    <h2 class="panel-title">🗂️ 图库 <span class="badge" id="countBadge">0</span></h2>
    <div class="grid" id="gallery"></div>
  </section>
</main>

<div id="toasts"></div>

<script>
/* =====================================================
   ①  基础配置（改这里即可）
   ===================================================== */
const OWNER  = 'douqg';
const REPO   = 'dqtc';
const BRANCH = 'main';

const SITE_BASE = `https://${OWNER}.github.io/${REPO}/`;
const API_BASE  = `https://api.github.com/repos/${OWNER}/${REPO}/contents`;
const TOKEN_KEY = `gh_pages_token_${OWNER}_${REPO}`;

/* 允许的扩展名 */
const IMAGE_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico'];
const AUDIO_EXT = ['mp3', 'wav', 'm4a', 'ogg', 'flac', 'aac'];
const ALLOWED_EXT = [...IMAGE_EXT, ...AUDIO_EXT];

/* 单文件大小上限（字节）——太大建议改用 Git LFS */
const MAX_SIZE = 20 * 1024 * 1024; // 20MB

/* =====================================================
   ②  DOM 引用
   ===================================================== */
const $ = id => document.getElementById(id);

const tokenInput   = $('tokenInput');
const saveTokenBtn = $('saveTokenBtn');
const clearTokenBtn= $('clearTokenBtn');
const tokenHint    = $('tokenHint');
const refreshBtn   = $('refreshBtn');
const dropzone     = $('dropzone');
const fileInput    = $('fileInput');
const uploadList   = $('uploadList');
const galleryEl    = $('gallery');
const countBadge   = $('countBadge');
const toastsEl     = $('toasts');

/* =====================================================
   ③  状态
   ===================================================== */
let token = localStorage.getItem(TOKEN_KEY) || '';
let uploading = false;

/* =====================================================
   ④  工具函数
   ===================================================== */
function toast(msg, type = 'info', duration = 3000) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  toastsEl.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 320);
  }, duration);
}

function getExt(name) {
  const i = name.lastIndexOf('.');
  return i === -1 ? '' : name.slice(i + 1).toLowerCase();
}

function formatSize(bytes) {
  if (typeof bytes !== 'number') return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 走降级方案 */ }

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

/* =====================================================
   ⑤  GitHub API 封装
   ===================================================== */
async function ghApi(path = '', options = {}) {
  if (!token) throw new Error('请先设置 GitHub Token');

  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers || {})
    }
  });

  const text = await res.text();
  let body = null;
  if (text) {
    try { body = JSON.parse(text); } catch (e) { body = null; }
  }

  if (!res.ok) {
    const err = new Error((body && body.message) || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return body;
}

/* =====================================================
   ⑥  Token 管理
   ===================================================== */
function updateTokenHint() {
  if (token) {
    const masked = token.length > 12
      ? token.slice(0, 7) + '…' + token.slice(-4)
      : '****';
    tokenHint.textContent = `✅ 已保存 Token（${masked}），保存在本机浏览器中。`;
    tokenHint.classList.add('ok');
  } else {
    tokenHint.textContent = 'Token 只保存在本机浏览器的 localStorage 中，不会上传到任何第三方服务器。请使用带 repo（或 Contents 读写）权限的 Token。';
    tokenHint.classList.remove('ok');
  }
}

function saveToken() {
  const v = tokenInput.value.trim();
  if (!v) { toast('请先输入 Token', 'error'); return; }
  if (v.length < 20) { toast('Token 长度看起来不对，请检查', 'error'); return; }

  token = v;
  localStorage.setItem(TOKEN_KEY, v);
  updateTokenHint();
  toast('Token 已保存', 'success');
  loadGallery();
}

function clearToken() {
  token = '';
  tokenInput.value = '';
  localStorage.removeItem(TOKEN_KEY);
  updateTokenHint();
  galleryEl.innerHTML = '<div class="grid-msg">请先在上方设置 GitHub Token</div>';
  countBadge.textContent = '0';
  toast('Token 已清除', 'info');
}

/* =====================================================
   ⑦  图库：加载 & 渲染
   ===================================================== */
async function loadGallery(silent = false) {
  if (!token) {
    galleryEl.innerHTML = '<div class="grid-msg">请先在上方设置 GitHub Token</div>';
    countBadge.textContent = '0';
    return;
  }

  galleryEl.innerHTML = '<div class="grid-msg">加载中…</div>';

  try {
    const data = await ghApi('?ref=' + encodeURIComponent(BRANCH));
    const files = (Array.isArray(data) ? data : []).filter(f => f.type === 'file');
    renderGallery(files);
    if (!silent) toast(`图库已刷新，共 ${files.length} 个文件`, 'success');
  } catch (e) {
    if (e.status === 404) {
      // 空仓库 或 分支不存在
      renderGallery([]);
      if (!silent) toast('图库为空', 'info');
    } else {
      galleryEl.innerHTML =
        `<div class="grid-msg error">加载失败：${escapeHtml(e.message)}</div>`;
      countBadge.textContent = '0';
      if (!silent) toast('加载图库失败：' + e.message, 'error', 4000);
    }
  }
}

function renderGallery(files) {
  galleryEl.innerHTML = '';
  countBadge.textContent = String(files.length);

  if (!files.length) {
    galleryEl.innerHTML = '<div class="grid-msg">图库里还没有文件，上传一个试试吧 ✨</div>';
    return;
  }

  files.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
  const frag = document.createDocumentFragment();
  files.forEach(f => frag.appendChild(buildCard(f)));
  galleryEl.appendChild(frag);
}

function buildCard(file) {
  const name = file.name;
  const ext  = getExt(name);
  const url  = SITE_BASE + encodeURIComponent(name);

  const card = document.createElement('div');
  card.className = 'file-card';

  /* --- 缩略图 / 播放器 --- */
  const thumb = document.createElement('div');
  thumb.className = 'thumb';

  if (IMAGE_EXT.includes(ext)) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = name;
    img.src = url;
    img.addEventListener('error', () => {
      thumb.innerHTML = '<div class="thumb-fallback">🖼️<span>预览加载失败</span></div>';
    });
    thumb.appendChild(img);
  } else if (AUDIO_EXT.includes(ext)) {
    thumb.classList.add('audio');
    const icon = document.createElement('div');
    icon.className = 'audio-icon';
    icon.textContent = '🎵';
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'none';
    audio.src = url;
    thumb.appendChild(icon);
    thumb.appendChild(audio);
  } else {
    thumb.innerHTML = '<div class="thumb-fallback">📄</div>';
  }

  /* --- 信息区 --- */
  const body = document.createElement('div');
  body.className = 'file-body';

  const nameEl = document.createElement('div');
  nameEl.className = 'file-name';
  nameEl.textContent = name;
  nameEl.title = name;

  const meta = document.createElement('div');
  meta.className = 'file-meta';
  meta.textContent = [formatSize(file.size), ext ? ext.toUpperCase() : '']
    .filter(Boolean).join(' · ');

  const linkRow = document.createElement('div');
  linkRow.className = 'link-row';

  const linkInput = document.createElement('input');
  linkInput.className = 'link-input';
  linkInput.type = 'text';
  linkInput.readOnly = true;
  linkInput.value = url;
  linkInput.addEventListener('focus', () => linkInput.select());
  linkInput.addEventListener('click', () => linkInput.select());

  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn-sm btn-copy';
  copyBtn.textContent = '复制';
  copyBtn.addEventListener('click', async () => {
    const ok = await copyText(url);
    toast(ok ? '链接已复制：' + name : '复制失败，请手动复制', ok ? 'success' : 'error');
  });

  linkRow.appendChild(linkInput);
  linkRow.appendChild(copyBtn);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const openBtn = document.createElement('button');
  openBtn.className = 'btn-sm btn-open';
  openBtn.textContent = '打开';
  openBtn.addEventListener('click', () => window.open(url, '_blank', 'noopener'));

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-sm btn-del';
  delBtn.textContent = '删除';
  delBtn.addEventListener('click', async () => {
    if (!confirm(`确定要删除「${name}」吗？\n此操作会提交一次删除 commit，不可撤销。`)) return;

    delBtn.disabled = true;
    delBtn.textContent = '删除中…';
    try {
      await ghApi('/' + encodeURIComponent(name), {
        method: 'DELETE',
        body: JSON.stringify({
          message: `delete: ${name}`,
          sha: file.sha,
          branch: BRANCH
        })
      });
      toast('已删除：' + name, 'success');
      card.style.transition = 'opacity .25s, transform .25s';
      card.style.opacity = '0';
      card.style.transform = 'scale(.94)';
      setTimeout(() => {
        card.remove();
        const left = galleryEl.querySelectorAll('.file-card').length;
        countBadge.textContent = String(left);
        if (left === 0) {
          galleryEl.innerHTML = '<div class="grid-msg">图库里还没有文件，上传一个试试吧 ✨</div>';
        }
      }, 240);
    } catch (e) {
      toast('删除失败：' + e.message, 'error', 4000);
      delBtn.disabled = false;
      delBtn.textContent = '删除';
    }
  });

  actions.appendChild(openBtn);
  actions.appendChild(delBtn);

  body.appendChild(nameEl);
  body.appendChild(meta);
  body.appendChild(linkRow);
  body.appendChild(actions);

  card.appendChild(thumb);
  card.appendChild(body);
  return card;
}

/* =====================================================
   ⑧  上传
   ===================================================== */
function createUploadItem(name) {
  const el = document.createElement('div');
  el.className = 'upload-item';

  const nameEl = document.createElement('span');
  nameEl.className = 'u-name';
  nameEl.textContent = name;
  nameEl.title = name;

  const bar = document.createElement('span');
  bar.className = 'bar';
  const fill = document.createElement('span');
  fill.className = 'bar-fill';
  bar.appendChild(fill);

  const status = document.createElement('span');
  status.className = 'u-status';
  status.textContent = '准备中…';

  el.appendChild(nameEl);
  el.appendChild(bar);
  el.appendChild(status);

  uploadList.prepend(el);
  return { el, fill, status };
}

function setBar(item, pct, state) {
  item.fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  item.fill.className = 'bar-fill' + (state ? ' ' + state : '');
}

function setStatus(item, cls, text) {
  item.status.className = 'u-status' + (cls ? ' ' + cls : '');
  item.status.textContent = text;
}

function removeItemLater(item) {
  setTimeout(() => {
    item.el.style.transition = 'opacity .3s, transform .3s';
    item.el.style.opacity = '0';
    item.el.style.transform = 'translateX(16px)';
    setTimeout(() => item.el.remove(), 320);
  }, 4000);
}

function uploadOne(file) {
  return new Promise(resolve => {
    const item = createUploadItem(file.name);

    const reader = new FileReader();

    reader.onprogress = e => {
      if (e.lengthComputable && e.total > 0) {
        setBar(item, (e.loaded / e.total) * 25);
      }
    };

    reader.onerror = () => {
      setStatus(item, 'error', '读取失败');
      setBar(item, 100, 'error');
      toast('读取文件失败：' + file.name, 'error');
      removeItemLater(item);
      resolve(false);
    };

    reader.onload = async () => {
      const dataUrl = String(reader.result || '');
      const base64 = dataUrl.split(',')[1] || '';
      if (!base64) {
        setStatus(item, 'error', '编码失败');
        setBar(item, 100, 'error');
        toast('文件编码失败：' + file.name, 'error');
        removeItemLater(item);
        resolve(false);
        return;
      }

      setStatus(item, '', '上传中…');
      let pct = 25;
      setBar(item, pct);
      const timer = setInterval(() => {
        pct = Math.min(pct + Math.random() * 9, 92);
        setBar(item, pct);
      }, 260);

      try {
        await ghApi('/' + encodeURIComponent(file.name), {
          method: 'PUT',
          body: JSON.stringify({
            message: `upload: ${file.name}`,
            content: base64,
            branch: BRANCH
          })
        });
        clearInterval(timer);
        setBar(item, 100, 'success');
        setStatus(item, 'success', '成功');
        toast('上传成功：' + file.name, 'success');
        removeItemLater(item);
        resolve(true);
      } catch (e) {
        clearInterval(timer);
        setBar(item, 100, 'error');
        let msg = e.message;
        if (e.status === 422) msg = '文件已存在或内容无效';
        if (e.status === 401) msg = 'Token 无效或权限不足';
        if (e.status === 404) msg = '仓库/分支不存在，或 Token 无权限';
        setStatus(item, 'error', '失败');
        toast(`上传失败：${file.name} — ${msg}`, 'error', 4500);
        removeItemLater(item);
        resolve(false);
      }
    };

    reader.readAsDataURL(file);
  });
}

async function handleFiles(fileList) {
  if (!token) {
    toast('请先在上方设置 GitHub Token', 'error');
    return;
  }
  if (uploading) {
    toast('还有文件正在上传，请稍候…', 'info');
    return;
  }

  const files = Array.from(fileList || []);
  if (!files.length) return;

  const valid = [];
  for (const f of files) {
    const ext = getExt(f.name);
    if (!ALLOWED_EXT.includes(ext)) {
      toast(`不支持的格式：${f.name}`, 'error');
      continue;
    }
    if (f.size > MAX_SIZE) {
      toast(`文件过大（上限 ${MAX_SIZE / 1024 / 1024}MB）：${f.name}`, 'error');
      continue;
    }
    if (f.size === 0) {
      toast(`空文件已跳过：${f.name}`, 'error');
      continue;
    }
    valid.push(f);
  }

  if (!valid.length) return;

  uploading = true;
  refreshBtn.disabled = true;

  let okCount = 0;
  // 串行上传，避免并发提交导致分支冲突（409）
  for (const f of valid) {
    const ok = await uploadOne(f);
    if (ok) okCount++;
  }

  uploading = false;
  refreshBtn.disabled = false;

  await loadGallery(true);

  if (valid.length > 1) {
    toast(`上传完成：成功 ${okCount} / ${valid.length}`, okCount === valid.length ? 'success' : 'info', 4000);
  }
}

/* =====================================================
   ⑨  事件绑定
   ===================================================== */
saveTokenBtn.addEventListener('click', saveToken);
clearTokenBtn.addEventListener('click', clearToken);
tokenInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') saveToken();
});

refreshBtn.addEventListener('click', async () => {
  if (!token) { toast('请先设置 GitHub Token', 'error'); return; }
  refreshBtn.classList.add('spinning');
  refreshBtn.disabled = true;
  await loadGallery();
  refreshBtn.classList.remove('spinning');
  refreshBtn.disabled = false;
});

/* 点击选择文件 */
dropzone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  if (fileInput.files && fileInput.files.length) {
    handleFiles(fileInput.files);
  }
  fileInput.value = '';
});

/* 拖拽 */
['dragenter', 'dragover'].forEach(ev =>
  dropzone.addEventListener(ev, e => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.add('dragover');
  })
);

['dragleave', 'dragend'].forEach(ev =>
  dropzone.addEventListener(ev, e => {
    e.preventDefault();
    e.stopPropagation();
    if (e.target === dropzone || !dropzone.contains(e.relatedTarget)) {
      dropzone.classList.remove('dragover');
    }
  })
);

dropzone.addEventListener('drop', e => {
  e.preventDefault();
  e.stopPropagation();
  dropzone.classList.remove('dragover');
  const dt = e.dataTransfer;
  if (dt && dt.files && dt.files.length) {
    handleFiles(dt.files);
  }
});

/* 防止拖到页面其他位置时浏览器直接打开文件 */
['dragover', 'drop'].forEach(ev =>
  window.addEventListener(ev, e => e.preventDefault())
);

/* =====================================================
   ⑩  初始化
   ===================================================== */
(function init() {
  // 顶部仓库信息
  $('repoInfo').textContent = `${OWNER} / ${REPO} · ${BRANCH} 分支 · ${SITE_BASE}`;

  // 文件选择框 accept
  fileInput.accept = ALLOWED_EXT.map(e => '.' + e).join(',');

  // 上传区提示
  $('dzHint').textContent =
    '支持 ' + ALLOWED_EXT.join(' / ') +
    '　（可多选，单个文件上限 ' + (MAX_SIZE / 1024 / 1024) + 'MB）';

  // Token 回填
  if (token) {
    tokenInput.value = token;
  }
  updateTokenHint();

  // 初次加载图库
  if (token) {
    loadGallery(true);
  } else {
    galleryEl.innerHTML = '<div class="grid-msg">请先在上方设置 GitHub Token</div>';
  }
})();
</script>
